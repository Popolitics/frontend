sonar.projectKey=Popolitics_frontend-service
sonar.organization=popolitics

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=frontend
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Sources et tests
sonar.sources=.
sonar.tests=frontend
sonar.exclusions=__tests__/**,coverage/**,jest.config.mjs,jest.setup.ts
sonar.coverage.exclusions=app/layout.tsx,**/*.config.*

# Couverture générée par `pnpm test:coverage` (Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.javascript.version=22
sonar.qualitygate.wait=true