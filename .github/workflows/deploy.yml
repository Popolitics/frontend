
name: Build, Push to GHCR and update GitOps

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Préparer le nom de l'image
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build et publication de l'image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'main' && vars.PROD_NEXT_PUBLIC_API_URL || vars.DEV_NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
  update-gitops:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: frontend-infra-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      INFRA_BRANCH: ${{ github.ref_name }}
      DEPLOYMENT_PATH: k8s/overlays/${{ github.ref_name == 'main' && 'prod' || 'dev' }}/frontend_service/kustomization.yaml
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Vérifier la configuration GitOps
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO_TOKEN" ]; then
            echo "::error::INFRA_REPO_TOKEN manquant."
            exit 1
          fi

      - name: Checkout du dépôt infra
        uses: actions/checkout@v4
        with:
          repository: Popolitics/infra
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Mettre à jour l'image GitOps
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["DEPLOYMENT_PATH"])
          image = os.environ["IMAGE_NAME"]
          tag = os.environ["IMAGE_TAG"]

          if image != "ghcr.io/popolitics/frontend":
              raise SystemExit("Image inattendue")

          if not re.fullmatch(r"[0-9a-f]{40}", tag):
              raise SystemExit("SHA invalide")

          content = path.read_text(encoding="utf-8")

          pattern = r"(?m)^(\s*newTag:\s*)\S+([ \t]*(?:#.*)?)$"

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + tag + m.group(2),
              content,
          )

          if count != 1:
              raise SystemExit(
                  f"Un seul newTag attendu, trouvé : {count}"
              )

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit et push du manifeste
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- "$DEPLOYMENT_PATH"

          if git diff --cached --quiet; then
            echo "Le manifeste référence déjà cette image."
            exit 0
          fi

          git commit -m \
            "ci(frontend): update ${INFRA_BRANCH} image to ${IMAGE_TAG}"

          git push origin "HEAD:${INFRA_BRANCH}"
